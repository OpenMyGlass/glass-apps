[workspace]
resolver = "2"
members = [
    "crates/glass-gfx",
    "crates/glass-gfx-gles",
    "crates/glass-ui",
    "crates/glass-launcher",
    "crates/glass-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OpenMyGlass/glass-apps"
rust-version = "1.80"

[workspace.dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "png-format"] }
fontdue = { version = "0.9", default-features = false, features = ["std", "hashbrown"] }
png = "0.18"
minifb = "0.29"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.17"
libloading = "0.8"
# glassd client, types and in-process mock (glass-services, pinned: M3 interface on its m3-android-glue branch until merged).
glass-api = { git = "https://github.com/OpenMyGlass/glass-services", rev = "c8bdc9ebc13995f25d87cdc283a78e71809dc548" }
glass-gfx = { path = "crates/glass-gfx" }
glass-gfx-gles = { path = "crates/glass-gfx-gles" }
glass-ui = { path = "crates/glass-ui" }
glass-launcher = { path = "crates/glass-launcher" }

[profile.release]
lto = "thin"
codegen-units = 1
