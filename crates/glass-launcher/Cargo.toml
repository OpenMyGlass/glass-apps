[package]
name = "glass-launcher"
description = "The Glass card timeline launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["gles"]
# Open a host window (development on a desktop).
window = ["glass-gfx/window"]
# The GLES2 renderer (EGL and GLES loaded with dlopen; needs a dynamically linked build).
gles = ["dep:glass-gfx-gles"]
# Present software frames to the Linux framebuffer (on-device, no GPU: Model B).
fb = ["glass-gfx/fb"]
# UI audio feedback on the device: play short clicks on the TWL6040 bone-conduction
# (Earphone/EP) output through ALSA directly (Model B). No effect on host/CI builds.
sound = []

[dependencies]
glass-gfx.workspace = true
glass-gfx-gles = { workspace = true, optional = true }
glass-ui.workspace = true
glass-api.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
