name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Window back-end build dependencies (minifb, X11 and Wayland)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libxcursor-dev libx11-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features glass-launcher/window -- -D warnings
      - run: cargo test --workspace --locked
      - name: Golden images that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: target/golden-actual/
          if-no-files-found: ignore
      - name: Benchmarks (reported, not enforced)
        run: cargo test --release --locked -p glass-ui --test bench -- --ignored --nocapture
      - name: Headless demo
        run: |
          cargo run --release --locked -p glass-launcher -- --headless --script examples/demo.script --out frames --time 10:42
          ls frames | head
      - uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          path: frames/
      - name: End-to-end with glassd --mock (glass-services at the pinned rev)
        run: |
          rev=$(sed -n 's/^glass-api = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          echo "glass-services rev: $rev"
          cargo install --locked --git https://github.com/OpenMyGlass/glass-services --rev "$rev" glassd --root target/glassd
          tools/e2e_glassd.sh target/glassd/bin/glassd target/release/glass-launcher
      - name: Licences of the dependencies
        run: |
          tools/check_licenses.sh -p glass-launcher --target x86_64-unknown-linux-gnu --features window
          tools/check_licenses.sh -p glass-launcher --target armv7-linux-androideabi
          tools/check_licenses.sh -p glass-launcher --target armv7-unknown-linux-gnueabihf
          tools/check_licenses.sh -p glass-launcher --target armv7-unknown-linux-musleabihf --no-default-features
          tools/check_licenses.sh -p glass-gfx-gles --target x86_64-unknown-linux-gnu
      - name: Software-only launcher (no gles feature)
        run: cargo clippy -p glass-launcher --no-default-features --all-targets --locked -- -D warnings

  gles:
    # Pinned so that the Mesa version changes only on purpose.
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      GLASS_GLES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Mesa EGL and GLES (llvmpipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2 libegl-mesa0 libgl1-mesa-dri
      - name: GL_RENDERER and GL_VERSION
        run: cargo test --locked -p glass-gfx-gles --test gles gl_info -- --nocapture
      - name: GLES tests against the goldens (SGX540 assertion layer on)
        run: cargo test --locked -p glass-gfx-gles -- --nocapture --test-threads=1
      - name: GLES settings cards and menus against their goldens
        run: cargo test --locked -p glass-launcher --test golden_settings -- --nocapture
      - name: GLES with the EGL 1.4 set-up (default display, pbuffer)
        env:
          EGL_PLATFORM: surfaceless
        run: cargo test --locked -p glass-gfx-gles --test gles pbuffer -- --nocapture
      - name: GLES images that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-gles
          path: target/golden-actual-gles/
          if-no-files-found: ignore
      - name: Headless demo with the GLES renderer
        run: |
          cargo run --release --locked -p glass-launcher -- --headless --renderer gles --script examples/demo.script --out frames-gles --time 10:42
          ls frames-gles | head
      - uses: actions/upload-artifact@v4
        with:
          name: demo-frames-gles
          path: frames-gles/

  linux-armv7-gnu:
    # Dynamically linked glibc build: the GLES path needs dlopen (route 2, libhybris).
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain, sysroot and QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - run: cargo build --release --locked --target armv7-unknown-linux-gnueabihf -p glass-launcher
      - name: Dynamically linked, no link-time EGL dependency
        run: |
          bin=target/armv7-unknown-linux-gnueabihf/release/glass-launcher
          file "$bin"
          arm-linux-gnueabihf-readelf -d "$bin" | grep NEEDED
          ! arm-linux-gnueabihf-readelf -d "$bin" | grep -E 'NEEDED.*(EGL|GLES)'
      - name: Device build without EGL is a hard error, software must be asked for
        run: |
          bin=target/armv7-unknown-linux-gnueabihf/release/glass-launcher
          if qemu-arm "$bin" --headless --script examples/demo.script --out frames 2>err.txt; then
            echo "expected a hard error without EGL"; exit 1
          fi
          cat err.txt
          grep -q "GLES renderer failed" err.txt
          qemu-arm "$bin" --headless --renderer software --script examples/demo.script --out frames --time 10:42
      - uses: actions/upload-artifact@v4
        with:
          name: glass-launcher-armv7-unknown-linux-gnueabihf
          path: target/armv7-unknown-linux-gnueabihf/release/glass-launcher

  android-armv7:
    # The Android launcher for both tracks: one API 19 build (KitKat 4.4.4 and Marshmallow
    # 6.0.1) with NDK r25c, the last NDK that targets API 19, and the Java wrapper against
    # android-19. Produces the directory the device tree takes as vendor/openmyglass/glass-apps.
    runs-on: ubuntu-24.04
    env:
      BUILD_TOOLS: "34.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: NDK r25c (pinned)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false
      - name: SDK platform 19 and build-tools (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-19" "build-tools;$BUILD_TOOLS" >/dev/null
          ls "$ANDROID_HOME/platforms/android-19/android.jar" "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
      - name: Clippy for Android (the JNI module)
        run: cargo clippy --locked --target armv7-linux-androideabi -p glass-android --all-targets -- -D warnings
      - name: JVM tests of the wrapper's pure Java
        run: |
          mkdir -p jvm
          javac -d jvm android/launcher/src/org/openmyglass/launcher/PlatformLines.java android/launcher/test/org/openmyglass/launcher/PlatformLinesTest.java
          java -cp jvm org.openmyglass.launcher.PlatformLinesTest
      - name: Build the dist directory (tools/android-dist.sh)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: tools/android-dist.sh dist/glass-apps
      - name: Check the native library (API 19 libraries only, EGL loaded at run time, JNI entry points)
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          so=dist/glass-apps/lib/libglass_launcher_jni.so
          file "$so"
          "$bin/llvm-readelf" -d "$so" | tee needed.txt | grep -E 'NEEDED|SONAME'
          ! grep -E 'NEEDED.*(EGL|GLES)' needed.txt
          for lib in $(sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' needed.txt); do
            case "$lib" in libc.so|libm.so|libdl.so|liblog.so|libandroid.so) ;; *) echo "unexpected NEEDED $lib"; exit 1 ;; esac
            test -e "$bin/../sysroot/usr/lib/arm-linux-androideabi/19/$lib" || { echo "$lib not in the API 19 sysroot"; exit 1; }
          done
          "$bin/llvm-nm" -D --defined-only "$so" | grep -c Java_org_openmyglass_launcher_NativeBridge_ | grep -qx 8
      - name: Check the APK (HOME activity, API 19, package name glassd allows)
        run: |
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk=dist/glass-apps/GlassLauncher.apk
          "$bt/aapt2" dump badging "$apk" | tee badging.txt | head -5
          grep -q "package: name='org.openmyglass.launcher'" badging.txt
          grep -q "sdkVersion:'19'" badging.txt
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          grep -q 'android.intent.category.HOME' manifest.txt
          "$bt/apksigner" verify --min-sdk-version 19 "$apk"
          unzip -l "$apk" | grep -q classes.dex
      - name: The device tree's product makefile refuses a missing prebuilt
        run: |
          mkdir -p mk/vendor/openmyglass && cp -r dist/glass-apps mk/vendor/openmyglass/
          printf 'include vendor/openmyglass/glass-apps/glass-apps.mk\nall:\n\t@echo $(PRODUCT_PACKAGES)\n' > mk/Makefile
          make -s -C mk | grep -qx 'GlassLauncher libglass_launcher_jni'
          rm mk/vendor/openmyglass/glass-apps/GlassLauncher.apk
          ! make -s -C mk 2>err.txt
          grep -q "android-dist.sh" err.txt
      - name: Licences of the Android library's dependencies
        run: tools/check_licenses.sh -p glass-android --target armv7-linux-androideabi
      - uses: actions/upload-artifact@v4
        with:
          name: glass-apps-android-dist
          path: dist/glass-apps/

  linux-armv7:
    # The software-only debug build: static musl, where dlopen cannot load EGL, so the
    # launcher is built without the `gles` feature.
    runs-on: ubuntu-latest
    env:
      # Static musl binary linked with the LLD that ships with Rust; no C toolchain needed.
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - run: cargo build --release --locked --target armv7-unknown-linux-musleabihf -p glass-launcher --no-default-features
      - run: file target/armv7-unknown-linux-musleabihf/release/glass-launcher
      - name: Tests on armv7 under QEMU (golden images included)
        # glass-gfx-gles needs libdl, which a static musl build does not have.
        run: cargo test --locked --target armv7-unknown-linux-musleabihf --workspace --exclude glass-gfx-gles --no-default-features
      - name: Golden images that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual-armv7
          path: target/golden-actual/
          if-no-files-found: ignore
      - name: Headless demo on armv7 under QEMU
        run: qemu-arm target/armv7-unknown-linux-musleabihf/release/glass-launcher --headless --script examples/demo.script --out frames --time 10:42
      - uses: actions/upload-artifact@v4
        with:
          name: glass-launcher-armv7-unknown-linux-musleabihf
          path: target/armv7-unknown-linux-musleabihf/release/glass-launcher
